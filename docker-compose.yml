version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pipelinehq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipelinehq
      POSTGRES_PASSWORD: pipelinehq_dev
      POSTGRES_DB: pipelinehq
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pipelinehq']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pipelinehq-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pipelinehq.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
